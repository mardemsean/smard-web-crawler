[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smard-web-crawler"
version = "0.2.0"
description = "Self-hosted web scraping with a multi-engine fallback chain (Obscura, Crawl4AI, Firecrawl, CloakBrowser, Decodo), HTTP API and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Sean Mardem" }]
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "aiofiles>=24.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "playwright>=1.53",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=2.3,<3"]
cloak = ["cloakbrowser==0.6.3"]
bench = ["psutil>=5.9"]
direct = ["crawl4ai>=0.4.0", "firecrawl-py>=1.0.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5"]
all = ["smard-web-crawler[server,mcp,bench]"]

[project.scripts]
smard-crawler = "smard_crawler.cli:main"
smard-crawler-mcp = "smard_crawler.server.mcp_server:main"

[tool.setuptools.packages.find]
include = ["smard_crawler*"]

[tool.setuptools.package-data]
"smard_crawler.bench" = ["probes.js", "fixtures/*", "fixtures/site/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
