# SMard Web Crawler stack. All ports are published on host loopback only.
#   docker compose up -d                  -> obscura + crawl4ai + api
#   scripts/firecrawl-up.sh               -> optional Firecrawl self-hosted stack (port 3002)
# Required in .env: OBSCURA_CDP_TOKEN, CRAWL4AI_API_TOKEN, SMARD_API_TOKEN (>= 32 chars; the installers generate them).

services:
  obscura:
    build: docker/obscura
    image: smard/obscura:0.2.5-stealth
    container_name: smard-obscura
    # String form so the proxy flag disappears when PROXY_URL is empty (Obscura ignores HTTP(S)_PROXY).
    command: serve --port 9222 --host 0.0.0.0 --stealth ${PROXY_URL:+--proxy ${PROXY_URL}}
    environment:
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN:?set OBSCURA_CDP_TOKEN (openssl rand -hex 32)}
      OBSCURA_TIMEZONE: ${OBSCURA_TIMEZONE:-}
      OBSCURA_GEOLOCATION: ${OBSCURA_GEOLOCATION:-}
    ports:
      - "127.0.0.1:9222:9222"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  crawl4ai:
    image: unclecode/crawl4ai:0.9.5
    container_name: smard-crawl4ai
    shm_size: 1g
    environment:
      # Without a token the 0.9.x server binds the container loopback and the published port is dead.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?set CRAWL4AI_API_TOKEN (openssl rand -hex 32)}
      # IPv4 bind: the default [::] bind fails on hosts without IPv6.
      GUNICORN_BIND: 0.0.0.0:11235
      # Request bodies may not carry proxy settings; the server dials out through this instead.
      CRAWL4AI_UPSTREAM_PROXY: ${PROXY_URL:-}
      MAX_CONCURRENT_TASKS: ${CRAWL4AI_MAX_CONCURRENT:-5}
      CRAWL4AI_NO_CLOUD_NOTICE: "1"
    ports:
      - "127.0.0.1:11235:11235"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

  api:
    build: .
    image: smard/web-crawler:0.2.0
    container_name: smard-api
    env_file:
      - path: .env
        required: false
    environment:
      SMARD_API_TOKEN: ${SMARD_API_TOKEN:?set SMARD_API_TOKEN (openssl rand -hex 32)}
      OBSCURA_CDP_URL: ws://obscura:9222
      OBSCURA_CDP_TOKEN: ${OBSCURA_CDP_TOKEN}
      OBSCURA_BIN: ""
      CRAWL4AI_BASE_URL: http://crawl4ai:11235
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN}
      FIRECRAWL_HOST: ${FIRECRAWL_HOST_FROM_DOCKER:-http://host.docker.internal:3002}
      CLOAKBROWSER_ENABLED: "false"
      OUTPUT_DIR: /data/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - smard-data:/data
    ports:
      - "127.0.0.1:8787:8787"
    depends_on:
      - obscura
      - crawl4ai
    restart: unless-stopped

volumes:
  smard-data:
